name: Wohnungs-Alarm

on:
  schedule:
    - cron: "*/15 5-21 * * *"   # alle 15 Min., ca. 6–23 Uhr deutscher Zeit
  workflow_dispatch:             # Knopf "Run workflow" zum Testen

permissions:
  contents: write

concurrency:
  group: wohnungs-alarm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python watcher.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Zustand speichern
        run: |
          git config user.name "wohnungs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Zustand aktualisiert"
          git push
